; Firmware del raton de laberinto (Arduino Nano 33 BLE Sense Rev2).
;   pio run -e raton -t upload             -> firmware de competencia
;   pio run -e prueba_hardware -t upload   -> prueba y calibracion de sensores y motores
;   pio device monitor                     -> Monitor Serie
; El nucleo portable (lib/raton_core) se prueba en el PC con CMake (ver CMakeLists.txt).

[platformio]
default_envs = raton
src_dir = firmware

[env]
platform = nordicnrf52
board = nano33ble
framework = arduino
monitor_speed = 115200
build_flags = -I firmware
lib_deps =
    pololu/VL53L0X@^1.3.1
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
    arduino-libraries/Arduino_BMI270_BMM150@^1.1.0
    arduino-libraries/ArduinoBLE@^1.3.7

[env:raton]
build_src_filter = +<*> -<hw_test/>

[env:prueba_hardware]
build_src_filter = +<hw/> +<hw_test/>
