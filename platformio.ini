; Firmware del raton de laberinto (Arduino Nano 33 BLE Sense Rev2, nRF52840 a 64 MHz).
;   pio run -t upload        compilar y subir
;   pio device monitor       Monitor Serie (115200)
; El nucleo (lib/raton_core) es el mismo que prueba el simulador: cmake -S . -B build && build/raton_sim --bench

[platformio]
default_envs = raton
src_dir = firmware

[env:raton]
platform = nordicnrf52
board = nano33ble
framework = arduino
monitor_speed = 115200
build_flags = -I firmware -O2
build_unflags = -Os
board_build.ldscript = firmware/nano33ble_map.ld
lib_deps =
    pololu/VL53L0X@^1.3.1
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
    arduino-libraries/Arduino_BMI270_BMM150@^1.1.0
    arduino-libraries/ArduinoBLE@^1.3.7
