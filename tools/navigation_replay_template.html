<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Navegación del ratón · evaluación</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}body{max-width:1000px;margin:24px auto;padding:0 16px}
.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select{font:inherit;padding:10px}input{width:100%}
canvas{display:block;width:100%;aspect-ratio:1.85;background:light-dark(#f7f8fa,#20242c)}p{line-height:1.5}
</style>
<h1>Evaluación de navegación</h1>
<p>Control experimental, red en observación, KP_WALL 0.15. Las cruces muestran contactos. Una parada cuenta como fallo; estos recorridos no representan una validación física.</p>
<div class="controls"><label for="scenario">Caso</label><select id="scenario"></select><button id="play">Reproducir</button><span id="clock"></span><span>2×</span></div>
<label for="seek">Tiempo simulado</label><input id="seek" type="range" min="0" step="0.05" value="0">
<canvas id="map" role="img" aria-label="Recorrido del ratón entre paredes y hacia la meta"></canvas>
<p id="status" aria-live="polite"></p><p>Trazo azul: recorrido · zona verde: meta · rectángulo: cuerpo completo · ×: contacto</p>
<script>
const scenarios=/* REPLAY_DATA */[];
const select=document.getElementById('scenario'),play=document.getElementById('play'),seek=document.getElementById('seek'),canvas=document.getElementById('map'),clock=document.getElementById('clock'),status=document.getElementById('status'),ctx=canvas.getContext('2d');
scenarios.forEach((d,i)=>{let o=document.createElement('option');o.value=i;o.textContent=d.name;select.append(o)});
let data=scenarios[0],t=0,playing=false,last=0;
function draw(){
if(!data||!data.frames.length)return;
let w=canvas.clientWidth,h=w/1.85,dpr=window.devicePixelRatio||1;canvas.width=w*dpr;canvas.height=h*dpr;ctx.scale(dpr,dpr);
let dark=matchMedia('(prefers-color-scheme: dark)').matches,ink=dark?'#e6e9ef':'#20242c',sc=Math.min((w-20)/data.width,(h-20)/data.height),ox=(w-data.width*sc)/2,oy=(h-data.height*sc)/2;
let X=x=>ox+x*sc,Y=y=>h-oy-y*sc;
ctx.strokeStyle=ink;ctx.lineWidth=1;ctx.beginPath();data.walls.forEach(([a,b])=>{ctx.moveTo(X(a[0]),Y(a[1]));ctx.lineTo(X(b[0]),Y(b[1]))});ctx.stroke();
ctx.fillStyle=dark?'#406e50':'#b9e6c8';ctx.fillRect(X(data.goal[0]*data.pitch),Y((data.goal[1]+1)*data.pitch),data.pitch*sc,data.pitch*sc);
let visible=data.frames.filter(f=>f[0]<=t),f=visible.at(-1)||data.frames[0];ctx.strokeStyle=dark?'#78b7ff':'#246ad1';ctx.lineWidth=2;ctx.beginPath();visible.forEach((f,i)=>i?ctx.lineTo(X(f[1]),Y(f[2])):ctx.moveTo(X(f[1]),Y(f[2])));ctx.stroke();
ctx.strokeStyle=dark?'#ff8585':'#b92020';let hits=0;data.events.forEach(([et,kind,x,y])=>{if(et>t||kind!=='choque')return;hits++;let px=X(x),py=Y(y);ctx.beginPath();ctx.moveTo(px-4,py-4);ctx.lineTo(px+4,py+4);ctx.moveTo(px-4,py+4);ctx.lineTo(px+4,py-4);ctx.stroke()});
ctx.save();ctx.translate(X(f[1]),Y(f[2]));ctx.rotate(-f[3]);ctx.fillStyle=ink;ctx.fillRect(-17*sc,-46*sc,100*sc,92*sc);ctx.fillStyle=dark?'#20242c':'#f7f8fa';ctx.beginPath();ctx.arc(65*sc,0,Math.max(1.5,8*sc),0,Math.PI*2);ctx.fill();ctx.restore();
seek.max=data.frames.at(-1)[0];seek.value=t;clock.textContent=t.toFixed(1)+' / '+Number(seek.max).toFixed(1)+' s';
status.textContent=hits+' contactos'+(t>=Number(seek.max)?' · '+(data.reached!==null?'Llegó a la meta':data.failure||'No llegó'):'');
}
select.onchange=()=>{data=scenarios[Number(select.value)];t=0;playing=false;play.textContent='Reproducir';draw()};
play.onclick=()=>{if(t>=Number(seek.max))t=0;playing=!playing;last=0;play.textContent=playing?'Pausar':'Reproducir'};
seek.oninput=()=>{t=Number(seek.value);draw()};
function animate(now){if(playing){if(last)t=Math.min(Number(seek.max),t+(now-last)/1000*2);last=now;draw();if(t>=Number(seek.max)){playing=false;play.textContent='Reproducir'}}requestAnimationFrame(animate)}
new ResizeObserver(draw).observe(canvas);draw();requestAnimationFrame(animate);
</script></html>
