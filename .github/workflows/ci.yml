# Integracion continua: nucleo C++ y raton completo en el simulador, firmware (PlatformIO) y web.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nucleo:
    name: Nucleo y simulador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake g++ >/dev/null
      - name: Compilar con sanitizers
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DRATON_SANITIZE=ON && cmake --build build --parallel
      - name: Pruebas (unitarias y misiones simuladas)
        run: ctest --test-dir build --output-on-failure
      - name: Bateria de laberintos (fisica ideal y con errores)
        run: |
          cmake -S . -B build-rel -DCMAKE_BUILD_TYPE=Release && cmake --build build-rel --parallel --target raton_sim
          build-rel/raton_sim --bench 20
      - name: Autonomia completa con cinco sensores
        run: |
          cmake --build build-rel --parallel --target raton_autonomy_tests
          build-rel/raton_autonomy_tests --bench 8

  firmware:
    name: Firmware (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - run: pip install platformio==6.1.16
      - name: Compilar
        run: pio run
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/raton/firmware.*

  web:
    name: Web de telemetria
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

